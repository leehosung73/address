<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주소록 관리 (Firebase DB 리스트 형태)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 800px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      color: #1e293b;
      margin-bottom: 20px;
      text-align: center;
    }

    /* 입력 폼 스타일 */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr) auto;
      gap: 10px;
      margin-bottom: 24px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .btn-add {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #1d4ed8;
    }

    .btn-add:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* 테이블 스타일 */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.95rem;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .td-no {
      width: 10%;
      text-align: center;
    }
    
    .td-action {
      width: 12%;
      text-align: center;
    }

    .btn-delete {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-delete:hover {
      background-color: #dc2626;
    }

    .empty-msg {
      text-align: center;
      color: #94a3b8;
      padding: 24px 0;
    }

    /* 반응형 레이아웃 */
    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>주소록 관리 (Firebase DB)</h1>

    <!-- 입력 폼 -->
    <form id="addressForm" class="form-grid">
      <div class="form-group">
        <input type="text" id="nameInput" placeholder="이름" required>
      </div>
      <div class="form-group">
        <input type="tel" id="phoneInput" placeholder="핸드폰번호 (예: 010-1234-5678)" required>
      </div>
      <div class="form-group">
        <input type="text" id="regionInput" placeholder="지역 (예: 서울, 경기)" required>
      </div>
      <button type="submit" id="submitBtn" class="btn-add">등록</button>
    </form>

    <!-- 주소록 테이블 -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="td-no">NO</th>
            <th>이름</th>
            <th>핸드폰번호</th>
            <th>지역</th>
            <th class="td-action">관리</th>
          </tr>
        </thead>
        <tbody id="addressTableBody">
          <tr>
            <td colspan="5" class="empty-msg">데이터를 불러오는 중입니다...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase 환경 설정
    const firebaseConfig = {
      apiKey: "AIzaSyCNkcV7oAO4li4ZyBvyOjGAWpuAHrLHxQU",
      authDomain: "address-ef7d6.firebaseapp.com",
      databaseURL: "https://address-ef7d6-default-rtdb.firebaseio.com",
      projectId: "address-ef7d6",
      storageBucket: "address-ef7d6.firebasestorage.app",
      messagingSenderId: "22857849985",
      appId: "1:22857849985:web:aadf05798406d7aa4f8180",
      measurementId: "G-6NMF0F08B5"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const addressesRef = ref(database, 'addresses');

    // 로컬 리스트 데이터 (Firebase와 동기화)
    let addressList = [];

    // DOM 요소
    const addressForm = document.getElementById('addressForm');
    const nameInput = document.getElementById('nameInput');
    const phoneInput = document.getElementById('phoneInput');
    const regionInput = document.getElementById('regionInput');
    const addressTableBody = document.getElementById('addressTableBody');
    const submitBtn = document.getElementById('submitBtn');

    // 1. Firebase에서 리스트 데이터 가져오기 (실시간 감지)
    onValue(addressesRef, (snapshot) => {
      const data = snapshot.val();
      
      // Firebase에서 가져온 리스트 저장 (데이터가 없으면 빈 배열)
      addressList = Array.isArray(data) ? data : (data ? Object.values(data) : []);
      
      renderTable();
    });

    // 화면 테이블 렌더링 함수
    function renderTable() {
      addressTableBody.innerHTML = '';

      if (addressList.length === 0) {
        addressTableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-msg">등록된 주소록이 없습니다.</td>
          </tr>
        `;
        return;
      }

      addressList.forEach((item, index) => {
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
          <td class="td-no">${index + 1}</td>
          <td>${escapeHtml(item.name)}</td>
          <td>${escapeHtml(item.tel)}</td>
          <td>${escapeHtml(item.loc)}</td>
          <td class="td-action">
            <button class="btn-delete" data-adm="${item.adm}">삭제</button>
          </td>
        `;

        // 삭제 버튼 이벤트
        tr.querySelector('.btn-delete').addEventListener('click', () => {
          deleteAddress(item.adm);
        });

        addressTableBody.appendChild(tr);
      });
    }

    // 2. Firebase 리스트에 데이터 추가
    addressForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = nameInput.value.trim();
      const tel = phoneInput.value.trim();
      const loc = regionInput.value.trim();

      if (!name || !tel || !loc) {
        alert('모든 항목을 입력해주세요.');
        return;
      }

      // 새 주소록 객체 생성 (요청한 필드명 적용)
      const newItem = {
        name: name,
        tel: tel,
        loc: loc,
        adm: 'adm_' + Date.now() // 관리 식별자
      };

      // 배열에 새 항목 추가
      const updatedList = [...addressList, newItem];

      try {
        submitBtn.disabled = true;
        
        // 전체 리스트를 Firebase DB에 덮어쓰기 형태로 저장
        await set(addressesRef, updatedList);

        // 입력창 초기화
        nameInput.value = '';
        phoneInput.value = '';
        regionInput.value = '';
        nameInput.focus();
      } catch (error) {
        console.error("데이터 저장 실패:", error);
        alert("데이터 저장 중 오류가 발생했습니다.");
      } finally {
        submitBtn.disabled = false;
      }
    });

    // 3. Firebase 리스트 데이터 삭제
    async function deleteAddress(admKey) {
      if (confirm('정말 삭제하시겠습니까?')) {
        try {
          // 해당 adm 값을 가진 요소 제거
          const updatedList = addressList.filter(item => item.adm !== admKey);
          
          // 업데이트된 리스트를 Firebase에 다시 저장
          await set(addressesRef, updatedList);
        } catch (error) {
          console.error("데이터 삭제 실패:", error);
          alert("삭제 중 오류가 발생했습니다.");
        }
      }
    }

    // XSS 방지용 문자열 이스케이프 함수
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
